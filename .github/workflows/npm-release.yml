name: Publish to npm

on:
  push:
    branches:
      - main
    tags:
      - '**'

permissions:
  contents: read

jobs:
  # No token here: the build runs the code of the dependencies, and only the job below can publish
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - run: npm ci --ignore-scripts
      - run: npm run build --if-present

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist

      - name: Check the tag is the version of the package
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          if [ "$GITHUB_REF_NAME" != "$VERSION" ]; then
            echo "The tag $GITHUB_REF_NAME is not the version $VERSION of package.json." >&2
            exit 1
          fi

      - name: Set unique next snapshot version
        if: github.ref == 'refs/heads/main'
        run: |
          VERSION=$(node -e 'const fs = require("node:fs"); const pkg = JSON.parse(fs.readFileSync("package.json", "utf8")); process.stdout.write(`${pkg.version}-next.${process.env.GITHUB_RUN_NUMBER}.${process.env.GITHUB_SHA.slice(0, 7)}`)')
          npm pkg set version="$VERSION"

      - name: Publish next snapshot
        if: github.ref == 'refs/heads/main'
        run: npm publish --tag next

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          if [[ "$VERSION" == *-* ]]; then
            # a prerelease like 1.0.0-beta.1 goes to the dist-tag of its identifier (beta), never to latest
            npm publish --tag "$(echo "${VERSION#*-}" | cut -d. -f1)"
          else
            npm publish
          fi
