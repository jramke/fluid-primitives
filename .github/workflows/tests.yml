name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} / TYPO3 ${{ matrix.typo3 }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # TYPO3 14.x combinations
          - php: '8.3'
            typo3: '14.3'
            fluid: '5'
          - php: '8.4'
            typo3: '14.3'
            fluid: '5'
          - php: '8.5'
            typo3: '14.3'
            fluid: '5'

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-typo3${{ matrix.typo3 }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php }}-typo3${{ matrix.typo3 }}-
            ${{ runner.os }}-php${{ matrix.php }}-

      - name: Install dependencies with specific TYPO3 version
        run: |
          composer require --no-update \
            "typo3/cms-core:^${{ matrix.typo3 }}" \
            "typo3/cms-extbase:^${{ matrix.typo3 }}" \
            "typo3/cms-fluid:^${{ matrix.typo3 }}" \
            "typo3fluid/fluid:^${{ matrix.fluid }}"
          composer update --prefer-dist --no-progress

      - name: Run tests
        run: composer test

  client:
    name: Client / vitest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run types

      - name: Run client tests
        run: npm test
