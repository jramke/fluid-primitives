name: TERUpload

on:
  push:
    tags:
      - '**'

jobs:
  TERUpload:
    # the TER only knows X.Y.Z versions, so a prerelease tag like 1.0.0-beta.1 is not uploaded
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v1
      - uses: tomasnorre/typo3-upload-ter@v2
        with:
          api-token: ${{ secrets.TYPO3_API_TOKEN }}
          php-version: 8.3
