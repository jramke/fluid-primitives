name: TERUpload

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

jobs:
  TERUpload:
    # the TER only knows X.Y.Z versions, so a prerelease tag like 1.0.0-beta.1 is not uploaded
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: tomasnorre/typo3-upload-ter@45877fb28167bf38efda42ddd484824d7f273cca # v2
        with:
          api-token: ${{ secrets.TYPO3_API_TOKEN }}
          php-version: 8.3
