<f:variable name="refData" value="{state: context.state, disabled: context.disabled, readonly: context.readOnly}" />

<button
    type="button"
    tabindex="-1"
    aria-expanded="{f:if(condition: '{context.state} == visible', then: 'true', else: 'false')}"
    aria-label="{context.visibilityTriggerLabel}"
    {f:if(condition: context.disabled, then: 'disabled' )}
    {f:if(condition: class, then: 'class="{class}"' )}
    {ui:ref(name: 'visibilityTrigger' , data: refData )}
    {ui:attributes()}
    {ui:asChild()}>
    <f:slot />
</button>
