<f:variable name="refData" value="{state: context.state, disabled: context.disabled, invalid: context.invalid, readonly: context.readOnly}" />

<input
    type="{f:if(condition: '{context.state} == visible', then: 'text', else: 'password')}"
    autocapitalize="off"
    spellcheck="false"
    autocomplete="{context.autoComplete}"
    {f:if(condition: context.name, then: 'name="{context.name}"' )}
    {f:if(condition: context.disabled, then: 'disabled' )}
    {f:if(condition: context.required, then: 'required' )}
    {f:if(condition: context.readOnly, then: 'readonly' )}
    {f:if(condition: context.invalid, then: 'aria-invalid="true"' )}
    {f:if(condition: context.ignorePasswordManagers, then: 'data-1p-ignore data-lpignore="true" data-bwignore="true" data-form-type="other" data-protonpass-ignore="true"' )}
    {f:if(condition: class, then: 'class="{class}"' )}
    {ui:ref(name: 'input' , data: refData )}
    {ui:attributes()}
    {ui:asChild()} />
