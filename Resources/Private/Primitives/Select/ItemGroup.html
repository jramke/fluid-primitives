<f:variable name="id">{ui:id()}</f:variable>
<f:variable name="refData" value="{disabled: context.disabled, id: id}" />

<div
    role="group"
    {f:if(condition: class, then: 'class="{class}"' )}
    id="{ui:partId(part: 'item-group', value: id)}"
    {ui:ref(name: 'item-group' , data: refData )}
    {ui:attributes()}>
    <f:slot />
</div>
