<f:variable name="id">{ui:id()}</f:variable>
<f:variable name="refData" value="{disabled: context.disabled, id: id}" />

<div
    role="group"
    {f:if(condition: class, then: 'class="{class}"' )}
    {ui:ref(name: 'item-group' , value: id, data: refData )}
    {ui:attributes()}>
    <f:slot />
</div>
