<f:variable name="isDialogPopup" value="{context.dialogPopup}" />
<f:variable name="placeholderShown">{f:if(condition: context.defaultValue, then: '{null}', else: '{true}')}</f:variable>
<f:variable name="state">{context.defaultOpen ? 'open' : 'closed'}</f:variable>
<f:variable name="refData" value="{
    disabled: context.disabled, 
    invalid: context.invalid, 
    readonly: context.readOnly, 
    placeholder-shown: placeholderShown,
    state: state,
    expanded: context.defaultOpen
}" />

<button
    type="button"
    role="combobox"
    aria-haspopup="{f:if(condition: isDialogPopup, then: 'dialog', else: 'listbox')}"
    {f:if(condition: class, then: 'class="{class}"' )}
    {ui:ref(name: 'trigger' , data: refData )}
    {f:if(condition: context.disabled, then: 'disabled' )}
    aria-invalid="{context.invalid}"
    {ui:attributes()}
    {ui:asChild()}>
    <f:slot />
</button>
