<ui:prop name="placeholder" type="string" optional="{true}" description="The placeholder text to render when no value is selected." />

<f:variable name="refData" value="{placeholder: placeholder, disabled: context.disabled, invalid: context.invalid}" />

<f:variable name="content">{placeholder ?: ''}</f:variable>
<f:if condition="{context.selectedItems}">
    <f:variable name="content">{context.collection -> ui:call(method: 'stringifyItems', arguments: {0: context.selectedItems})}</f:variable>
</f:if>

<span
    {f:if(condition: class, then: 'class="{class}"' )}
    {ui:ref(name: 'valueText' , data: refData )}
    {ui:attributes()}
    {ui:asChild()}>
    {content}
</span>
