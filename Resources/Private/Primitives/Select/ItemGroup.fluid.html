<ui:prop name="value" type="string" context="{true}" optional="{true}" requiredAtRuntime="{true}" description="The value identifier of the item group." />

<f:variable name="refData" value="{disabled: context.disabled}" />

<div
    role="group"
    {f:if(condition: class, then: 'class="{class}"' )}
    {ui:ref(name: 'itemGroup' , value: value, data: refData )}
    {ui:attributes()}>
    <f:slot />
</div>
