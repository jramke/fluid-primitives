<f:variable name="resolvedOrientation" value="{f:if(condition: context.scrollbar.orientation, then: context.scrollbar.orientation, else: 'vertical')}" />

<div
    {f:if(condition: class, then: 'class="{class}"' )}
    {ui:ref(name: 'thumb' , value: resolvedOrientation, data: {orientation: resolvedOrientation} )}
    style="{context.thumbStyles}"
    {ui:attributes()}>
</div>
