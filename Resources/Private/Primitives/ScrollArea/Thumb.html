<f:variable name="orientation" value="{context.scrollbar.orientation}" />

<div
    {f:if(condition: class, then: 'class="{class}"' )}
    id="{ui:partId(part: 'thumb', value: orientation)}"
    {ui:ref(name: 'thumb' , data: {orientation: context.scrollbar.orientation} )}
    style="{context.thumbStyles}"
    {ui:attributes()}>
</div>
