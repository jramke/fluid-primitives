<ui:prop name="value" type="string" optional="{true}" description="The value of the trigger this content belongs to. Render one content per trigger inside a viewport to animate between them." />

<f:variable name="state">{f:if(condition: context.defaultOpen, then: 'open', else: 'closed')}</f:variable>
<f:variable name="hidden">{f:if(condition: context.defaultOpen, then: '{false}', else: '{true}')}</f:variable>
<f:variable name="refData" value="{state: state}" />

<div
    role="{f:if(condition: context.dialogPopup, then: 'dialog', else: 'menu')}"
    tabindex="{f:if(condition: context.dialogPopup, then: '-1', else: '0')}"
    {f:if(condition: context.ariaLabel, then: 'aria-label="{context.ariaLabel}"' )}
    {f:if(condition: class, then: 'class="{class}"' )}
    {ui:ref(name: 'content' , value: value, data: refData )}
    {ui:attributes()}
    {ui:asChild()}
    {f:if(condition: hidden, then: 'hidden="{hidden}"' )}>
    <f:slot />
</div>
