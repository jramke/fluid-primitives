<ui:prop name="value" type="string" optional="{true}" context="{true}" requiredAtRuntime="{true}" description="The unique value of the radio item." />
<ui:prop name="checked" type="boolean" optional="{true}" context="{true}" default="{false}" description="Whether the radio item is checked when rendered." />
<ui:prop name="disabled" type="boolean" optional="{true}" context="{true}" description="Whether the radio item is disabled." />
<ui:prop name="valueText" type="string" optional="{true}" context="{true}" description="The textual value of the item, used for typeahead navigation. Falls back to the item's text content when omitted." />
<ui:prop name="name" type="string" optional="{true}" context="{true}" description="Groups radio items so selecting one unchecks the others sharing the same `name`." />

<f:variable name="optionState">{context -> ui:call(method: 'getOptionItemState', arguments: {0: {value: value, valueText: valueText, type: 'radio', disabled: disabled, checked: checked}})}</f:variable>

<div
    role="{optionState.role}"
    aria-checked="{f:if(condition: optionState.checked, then: 'true', else: 'false')}"
    {f:if(condition: disabled, then: 'aria-disabled="true" data-disabled=""' )}
    {f:if(condition: class, then: 'class="{class}"' )}
    {ui:ref(name: 'item' , value: value, data: {type: 'radio' , valuetext: valueText, state: optionState.state, name: name} )}
    {ui:attributes()}>
    <f:slot />
</div>
