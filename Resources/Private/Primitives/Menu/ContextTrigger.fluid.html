<ui:prop name="value" type="string" optional="{true}" context="{true}" description="The value that identifies this specific context trigger, for a menu with multiple context triggers." />

<f:variable name="triggerState">{context -> ui:call(method: 'getTriggerState', arguments: {0: value})}</f:variable>

<div
    {f:if(condition: class, then: 'class="{class}"' )}
    {ui:ref(name: 'contextTrigger' , value: value, data: {state: triggerState.state, current: triggerState.current} )}
    {ui:attributes()}>
    <f:slot />
</div>
