<f:comment>The part is a live region that stays on the page, so a screen reader announces its content when it shows. The inner element is the one you style.</f:comment>
<div role="status" aria-live="polite" aria-atomic="true" {ui:ref(name: 'empty' )}>
    <div
        hidden
        {f:if(condition: class, then: 'class="{class}"' )}
        {ui:attributes()}
        {ui:asChild()}>
        <f:slot />
    </div>
</div>
