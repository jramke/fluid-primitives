<ui:prop name="name" type="string" optional="{true}" client="{true}" requiredAtRuntime="{true}" description="The unique field name used to associate labels, descriptions, errors, and form values." />
<ui:prop name="disabled" type="boolean" optional="{true}" client="{true}" description="Whether the field is disabled." />
<ui:prop name="invalid" type="boolean" optional="{true}" client="{true}" description="Whether the field is invalid." />
<ui:prop name="required" type="boolean" optional="{true}" client="{true}" description="Whether the field is required." />
<ui:prop name="readOnly" type="boolean" optional="{true}" client="{true}" description="Whether the field is read-only." />
<ui:prop name="defaultValue" type="mixed" optional="{true}" client="{true}" description="The initial value that child controls can use when rendered inside the field." />
<ui:prop name="listenTo" type="array" optional="{true}" client="{true}" description="Names of sibling fields within the same form whose value changes this field should react to. Dispatches a `fluid-primitives:field:dependencychange` event on this field's root element (see `Field.onDependencyChange()`) on every value change of a listened-to field, and re-runs this field's own validation whenever a listened-to field validates itself (on blur, or on change once it already has an error) - not on every keystroke - e.g. a `passwordConfirm` field listening to `password`." />

<f:variable name="refData" value="{pristine: '{true}', default-value: '{true}'}" />

<div
    data-name="{context.name}"
    {f:if(condition: invalid, then: 'data-invalid' )}
    {f:if(condition: disabled, then: 'data-disabled' )}
    {f:if(condition: readOnly, then: 'data-readonly' )}
    {f:if(condition: required, then: 'data-required' )}
    {f:if(condition: class, then: 'class="{class}"' )}
    {ui:ref(name: 'root' , data: refData )}
    {ui:attributes()}>
    <f:slot />
</div>
