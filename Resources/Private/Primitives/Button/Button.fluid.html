<ui:prop name="type" type="string" optional="{true}" default="button" description="The `type` of the button. It defaults to `button`, so a button inside a form does not submit it. Use `submit` or `reset` to opt in." />
<ui:prop name="disabled" type="boolean" optional="{true}" client="{true}" default="{false}" description="Whether the button is disabled." />
<ui:prop name="loading" type="boolean" optional="{true}" client="{true}" default="{false}" description="Whether the button is loading. A loading button is disabled too." />
<ui:prop name="focusableWhenDisabled" type="boolean" optional="{true}" client="{true}" default="{false}" description="Keeps a disabled button focusable. It then gets `aria-disabled` instead of the `disabled` attribute, and clicks and key presses are ignored." />

<button
    type="{type}"
    {f:if(condition: '{context.disabled} && {focusableWhenDisabled}' , then: 'aria-disabled="true"' )}
    {f:if(condition: '{context.disabled} && !{focusableWhenDisabled}' , then: 'disabled' )}
    {f:if(condition: context.disabled, then: 'data-disabled' )}
    {f:if(condition: loading, then: 'data-loading' )}
    {f:if(condition: class, then: 'class="{class}"' )}
    {ui:ref(name: 'root' )}
    {ui:attributes()}
    {ui:asChild()}>
    <f:slot />
</button>
