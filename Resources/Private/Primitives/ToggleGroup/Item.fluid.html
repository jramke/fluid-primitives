<ui:prop name="value" type="string" optional="{true}" context="{true}" requiredAtRuntime="{true}" description="The value of the toggle group item." />
<ui:prop name="disabled" type="boolean" optional="{true}" context="{true}" description="Whether the item is disabled. An item of a disabled group is always disabled." />

<f:variable name="itemProps" value="{value: value, disabled: disabled}" />
<f:variable name="itemState">{context -> ui:call(method: 'getItemState', arguments: {0: itemProps})}</f:variable>

<f:variable name="refData" value="{pressed: itemState.pressed, disabled: itemState.disabled, orientation: context.orientation}" />

<button
    type="button"
    aria-pressed="{f:if(condition: itemState.pressed, then: 'true', else: 'false')}"
    {f:if(condition: itemState.disabled, then: 'disabled' )}
    {f:if(condition: class, then: 'class="{class}"' )}
    {ui:ref(name: 'item' , value: value, data: refData )}
    {ui:attributes()}
    {ui:asChild()}>
    <f:slot />
</button>
