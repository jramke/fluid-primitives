<ui:prop name="view" type="string" optional="{true}" requiredAtRuntime="{true}" description="The view this element navigates: `day`, `month`, or `year`." />

<button
    type="button"
    {f:if(condition: class, then: 'class="{class}"' )}
    {ui:ref(name: 'prevTrigger' , value: view )}
    {ui:attributes()}
    {ui:asChild()}>
    <f:slot />
</button>
