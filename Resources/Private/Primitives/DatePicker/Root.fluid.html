<ui:prop name="locale" type="string" optional="{true}" client="{true}" default="en-US" description="The locale (BCP 47 language tag) to use when formatting the date." />
<ui:prop name="timeZone" type="string" optional="{true}" client="{true}" default="UTC" description="The time zone to use." />
<ui:prop name="name" type="string" optional="{true}" client="{true}" description="The `name` attribute of the underlying input. Inherited from a surrounding field when available." />
<ui:prop name="disabled" type="boolean" optional="{true}" client="{true}" description="Whether the date picker is disabled. Inherited from a surrounding field when available." />
<ui:prop name="readOnly" type="boolean" optional="{true}" client="{true}" description="Whether the date picker is read-only. Inherited from a surrounding field when available." />
<ui:prop name="required" type="boolean" optional="{true}" client="{true}" description="Whether the date picker is required. Inherited from a surrounding field when available." />
<ui:prop name="invalid" type="boolean" optional="{true}" client="{true}" description="Whether the date picker is invalid. Inherited from a surrounding field when available." />
<ui:prop name="outsideDaySelectable" type="boolean" optional="{true}" client="{true}" default="{false}" description="Whether a day outside the visible range can be selected." />
<ui:prop name="min" type="string" optional="{true}" client="{true}" description="The minimum date that can be selected, as an ISO date string." />
<ui:prop name="max" type="string" optional="{true}" client="{true}" description="The maximum date that can be selected, as an ISO date string." />
<ui:prop name="closeOnSelect" type="boolean" optional="{true}" client="{true}" default="{true}" description="Whether the calendar should close after the date selection is complete. Ignored when `selectionMode` is `multiple`." />
<ui:prop name="openOnClick" type="boolean" optional="{true}" client="{true}" default="{false}" description="Whether to open the calendar when the input is clicked." />
<ui:prop name="defaultValue" type="mixed" optional="{true}" client="{true}" description="The initial selected date(s) when rendered, as an ISO date string or an array of ISO date strings. Use when you don't need to control the selected date(s) of the date picker. Inherited from a surrounding field when available." />
<ui:prop name="defaultFocusedValue" type="string" optional="{true}" client="{true}" description="The initial focused date when rendered, as an ISO date string. Use when you don't need to control the focused date of the date picker." />
<ui:prop name="numOfMonths" type="integer" optional="{true}" client="{true}" description="The number of months to display." />
<ui:prop name="startOfWeek" type="integer" optional="{true}" client="{true}" description="The first day of the week. `0` is Sunday, `1` is Monday, and so on." />
<ui:prop name="fixedWeeks" type="boolean" optional="{true}" client="{true}" description="Whether the calendar should render with a fixed number of weeks (6), instead of 5 or 6 depending on the month." />
<ui:prop name="showWeekNumbers" type="boolean" optional="{true}" client="{true}" description="Whether to show the week number column in the day view." />
<ui:prop name="selectionMode" type="Jramke\FluidPrimitives\Enum\DatePickerSelectionMode" optional="{true}" client="{true}" default="{f:constant(name: 'Jramke\FluidPrimitives\Enum\DatePickerSelectionMode::Single')}" description="The selection mode of the calendar: `single`, `multiple`, or `range`." />
<ui:prop name="maxSelectedDates" type="integer" optional="{true}" client="{true}" description="The maximum number of dates that can be selected. Only applicable when `selectionMode` is `multiple`." />
<ui:prop name="placeholder" type="string" optional="{true}" client="{true}" description="The placeholder text to display in the input." />
<ui:prop name="defaultView" type="Jramke\FluidPrimitives\Enum\DatePickerView" optional="{true}" client="{true}" default="{f:constant(name: 'Jramke\FluidPrimitives\Enum\DatePickerView::Day')}" description="The default view of the calendar: `day`, `month`, or `year`." />
<ui:prop name="minView" type="Jramke\FluidPrimitives\Enum\DatePickerView" optional="{true}" client="{true}" default="{f:constant(name: 'Jramke\FluidPrimitives\Enum\DatePickerView::Day')}" description="The minimum view of the calendar." />
<ui:prop name="maxView" type="Jramke\FluidPrimitives\Enum\DatePickerView" optional="{true}" client="{true}" default="{f:constant(name: 'Jramke\FluidPrimitives\Enum\DatePickerView::Year')}" description="The maximum view of the calendar." />
<ui:prop name="positioning" type="array" optional="{true}" client="{true}" default="{ placement: 'bottom-start', gutter: 8 }" description="The positioning options of the calendar content." />
<ui:prop name="defaultOpen" type="boolean" optional="{true}" client="{true}" default="{false}" description="The initial open state of the date picker when rendered. Use when you don't need to control the open state of the date picker." />
<ui:prop name="inline" type="boolean" optional="{true}" client="{true}" default="{false}" description="Whether to render the date picker inline, without a popover." />
<ui:prop name="dir" type="Jramke\FluidPrimitives\Enum\Direction" optional="{true}" client="{true}" default="{f:constant(name: 'Jramke\FluidPrimitives\Enum\Direction::Ltr')}" description="The document's text/writing direction." />
<ui:prop name="translations" type="array" optional="{true}" client="{true}" description="Localized date picker labels. Set entries to `{false}` to omit the corresponding `aria-label`. Use `f:translate` for per-template localization overrides when needed." />

<f:variable name="state">{context -> ui:call(method: 'getState')}</f:variable>
<f:variable name="empty">{f:if(condition: defaultValue, then: '{false}', else: '{true}')}</f:variable>
<f:variable name="refData" value="{state: state, disabled: disabled, readonly: readOnly, empty: empty}" />

<div
    {f:if(condition: class, then: 'class="{class}"' )}
    {ui:ref(name: 'root' , data: refData )}
    {ui:attributes()}>
    <f:slot />
</div>
