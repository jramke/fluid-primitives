<ui:prop name="locale" type="string" optional="{true}" client="{true}" description="The locale (BCP 47 language tag) used to format and parse dates. Inherited from the site's language." />
<ui:prop name="timeZone" type="string" optional="{true}" client="{true}" description="The IANA time zone dates are evaluated in, e.g. `Europe/Berlin`. Defaults to the time zone of the browser." />
<ui:prop name="name" type="string" optional="{true}" client="{true}" description="The `name` attribute of the underlying input. Inherited from a surrounding field when available." />
<ui:prop name="disabled" type="boolean" optional="{true}" client="{true}" description="Whether the date picker is disabled. Inherited from a surrounding field when available." />
<ui:prop name="readOnly" type="boolean" optional="{true}" client="{true}" description="Whether the date picker is read-only. Inherited from a surrounding field when available." />
<ui:prop name="required" type="boolean" optional="{true}" client="{true}" description="Whether the date picker is required. Inherited from a surrounding field when available." />
<ui:prop name="invalid" type="boolean" optional="{true}" client="{true}" description="Whether the date picker is invalid. Inherited from a surrounding field when available." />
<ui:prop name="outsideDaySelectable" type="boolean" optional="{true}" client="{true}" default="{false}" description="Whether a day outside the visible month can be selected." />
<ui:prop name="min" type="string" optional="{true}" client="{true}" description="The minimum date that can be selected, as an ISO date string (`2025-01-31`)." />
<ui:prop name="max" type="string" optional="{true}" client="{true}" description="The maximum date that can be selected, as an ISO date string (`2025-01-31`)." />
<ui:prop name="closeOnSelect" type="boolean" optional="{true}" client="{true}" default="{true}" description="Whether the calendar should close after the date selection is complete. Ignored when `selectionMode` is `multiple`." />
<ui:prop name="openOnClick" type="boolean" optional="{true}" client="{true}" default="{false}" description="Whether to open the calendar when the input is clicked." />
<ui:prop name="defaultValue" type="mixed" optional="{true}" description="The initial selected date(s) when rendered: an ISO date string (`2025-01-31`), a `DateTimeInterface`, or a list of them. Use when you don't need to control the selected date(s) of the date picker. Inherited from a surrounding field when available." />
<ui:prop name="defaultFocusedValue" type="string" optional="{true}" client="{true}" description="The initially focused date when rendered, as an ISO date string. Use when you don't need to control the focused date of the date picker." />
<ui:prop name="numOfMonths" type="integer" optional="{true}" client="{true}" description="The number of months the day view shows next to each other." />
<ui:prop name="startOfWeek" type="integer" optional="{true}" client="{true}" description="The first day of the week. `0` is Sunday, `1` is Monday, and so on." />
<ui:prop name="fixedWeeks" type="boolean" optional="{true}" client="{true}" description="Whether the calendar should render with a fixed number of weeks (6), instead of 5 or 6 depending on the month." />
<ui:prop name="showWeekNumbers" type="boolean" optional="{true}" client="{true}" description="Whether to show the week number column in the day view." />
<ui:prop name="selectionMode" type="Jramke\FluidPrimitives\Enum\DatePickerSelectionMode" optional="{true}" client="{true}" default="{f:constant(name: 'Jramke\FluidPrimitives\Enum\DatePickerSelectionMode::Single')}" description="The selection mode of the calendar: `single`, `multiple`, or `range`." />
<ui:prop name="maxSelectedDates" type="integer" optional="{true}" client="{true}" description="The maximum number of dates that can be selected. Only applicable when `selectionMode` is `multiple`." />
<ui:prop name="placeholder" type="string" optional="{true}" client="{true}" description="The placeholder text of the input. Defaults to the date format of the `locale`, e.g. `dd.mm.yyyy`." />
<ui:prop name="defaultView" type="Jramke\FluidPrimitives\Enum\DatePickerView" optional="{true}" client="{true}" default="{f:constant(name: 'Jramke\FluidPrimitives\Enum\DatePickerView::Day')}" description="The view the calendar starts in: `day`, `month`, or `year`." />
<ui:prop name="minView" type="Jramke\FluidPrimitives\Enum\DatePickerView" optional="{true}" client="{true}" default="{f:constant(name: 'Jramke\FluidPrimitives\Enum\DatePickerView::Day')}" description="The smallest view of the calendar. `month` turns it into a month picker." />
<ui:prop name="maxView" type="Jramke\FluidPrimitives\Enum\DatePickerView" optional="{true}" client="{true}" default="{f:constant(name: 'Jramke\FluidPrimitives\Enum\DatePickerView::Year')}" description="The largest view of the calendar." />
<ui:prop name="positioning" type="array" optional="{true}" client="{true}" default="{ placement: 'bottom-start', gutter: 8 }" description="The positioning options of the calendar content." />
<ui:prop name="defaultOpen" type="boolean" optional="{true}" client="{true}" default="{false}" description="The initial open state of the date picker when rendered. Use when you don't need to control the open state of the date picker." />
<ui:prop name="inline" type="boolean" optional="{true}" client="{true}" default="{false}" description="Whether to render the calendar in the page, without a popup. It is always open and has no trigger." />
<ui:prop name="translations" type="array" optional="{true}" client="{true}" description="Localized date picker labels, by the id of the `datePicker.*` units of the language file. Set entries to `{false}` to omit the corresponding `aria-label`. Use `f:translate` for per-template localization overrides when needed." />

<f:variable name="refData" value="{state: context.state, disabled: context.disabled, readonly: context.readOnly, empty: context.empty}" />

<div
    {f:if(condition: class, then: 'class="{class}"' )}
    {ui:ref(name: 'root' , data: refData )}
    {ui:attributes()}
    {ui:asChild()}>
    <f:slot />
</div>
