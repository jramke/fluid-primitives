<ui:prop name="level" type="integer" optional="{true}" default="3" description="The heading level to render for the accordion item header." />

<ui:error when="!{context.item.value}" message="The {component.fullName} must only be used inside an accordion.item component" />

<f:variable name="value" value="{context.item.value}" />
<f:variable name="refData" value="{value: value}" />

<h{level}
    {f:if(condition: class, then: 'class="{class}"' )}
    id="{ui:partId(part: 'item-header', value: value)}"
    {ui:ref(name: 'item-header' , data: refData )}
    {ui:attributes()}>
    <f:slot />
</h{level}>
