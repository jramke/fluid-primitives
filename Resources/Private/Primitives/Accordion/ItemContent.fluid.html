<ui:error when="!{context.item.value}" message="The {component.fullName} must only be used inside an accordion.item component" />
<f:variable name="value" value="{context.item.value}" />

<f:variable name="itemState">{context -> ui:call(method: 'getItemState', arguments: {0: context.item})}</f:variable>

<f:comment>No data-state on content that is open on load, as the collapsible renders it: the open animation must not run before hydration.</f:comment>
<f:variable name="refData" value="{disabled: itemState.disabled, orientation: context.orientation}" />
<f:if condition="!{itemState.expanded}">
    <f:variable name="refData" value="{disabled: itemState.disabled, orientation: context.orientation, state: 'closed'}" />
</f:if>

<div
    role="region"
    {f:if(condition: '!{itemState.expanded}' , then: 'hidden' )}
    {f:if(condition: class, then: 'class="{class}"' )}
    {ui:ref(name: 'itemContent' , value: value, data: refData )}
    {ui:attributes()}
    {ui:asChild()}>
    <f:slot />
</div>
