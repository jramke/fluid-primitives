<ui:prop name="collection" type="Jramke\FluidPrimitives\Domain\Model\ListCollection" optional="{true}" client="{true}" requiredAtRuntime="{true}" description="The item collection." />
<ui:prop name="name" type="string" optional="{true}" client="{true}" description="The `name` attribute of the underlying select. Inherited from a surrounding field when available." />
<ui:prop name="form" type="string" optional="{true}" client="{true}" description="The associate form of the underlying select." />
<ui:prop name="disabled" type="boolean" optional="{true}" client="{true}" description="Whether the select is disabled. Inherited from a surrounding field when available." />
<ui:prop name="invalid" type="boolean" optional="{true}" client="{true}" description="Whether the select is invalid. Inherited from a surrounding field when available." />
<ui:prop name="readOnly" type="boolean" optional="{true}" client="{true}" description="Whether the select is read-only. Inherited from a surrounding field when available." />
<ui:prop name="required" type="boolean" optional="{true}" client="{true}" description="Whether the select is required. Inherited from a surrounding field when available." />
<ui:prop name="placeholder" type="string" optional="{true}" client="{true}" description="The placeholder text of the combobox's input." />
<ui:prop name="defaultOpen" type="boolean" optional="{true}" client="{true}" description="The initial open state of the combobox when rendered. Use when you don't need to control the open state of the combobox." />
<ui:prop name="defaultValue" type="mixed" optional="{true}" client="{true}" description="The initial value of the combobox's selected items when rendered. Use when you don't need to control the value of the combobox's selected items." />
<ui:prop name="defaultInputValue" type="string" optional="{true}" client="{true}" description="The initial value of the combobox's input when rendered. Use when you don't need to control the value of the combobox's input." />
<ui:prop name="defaultHighlightedValue" type="string" optional="{true}" client="{true}" description="The initial highlighted value of the combobox when rendered. Use when you don't need to control the highlighted value of the combobox." />
<ui:prop name="openOnClick" type="boolean" optional="{true}" client="{true}" default="{true}" description="Whether to open the combobox popup on initial click on the input." />
<ui:prop name="openOnKeyPress" type="boolean" optional="{true}" client="{true}" default="{true}" description="Whether to open the combobox on arrow key press." />
<ui:prop name="openOnChange" type="boolean" optional="{true}" client="{true}" default="{true}" description="Whether to show the combobox when the input value changes." />
<ui:prop name="closeOnSelect" type="boolean" optional="{true}" client="{true}" description="Whether to close the combobox when an item is selected. Defaults to `true` or if multiple enabled `false`." />
<ui:prop name="loopFocus" type="boolean" optional="{true}" client="{true}" default="{true}" description="Whether to loop focus within the combobox." />
<ui:prop name="multiple" type="boolean" optional="{true}" client="{true}" description="Whether to allow multiple selection. **Good to know:** When `multiple` is `true`, the `selectionBehavior` is automatically set to `clear`. It is recommended to render the selected items in a separate container." />
<ui:prop name="allowCustomValue" type="boolean" optional="{true}" client="{true}" default="{false}" description="Whether to allow typing custom values in the input." />
<ui:prop name="alwaysSubmitOnEnter" type="boolean" optional="{true}" client="{true}" default="{false}" description="Whether to always submit on Enter key press, even if popup is open. Useful for single-field autocomplete forms where Enter should submit the form." />
<ui:prop name="inputBehavior" type="Jramke\FluidPrimitives\Enum\ComboboxInputBehavior" optional="{true}" client="{true}" default="{f:constant('Jramke\FluidPrimitives\Enum\ComboboxInputBehavior::None')}" description="Defines the auto-completion behavior of the combobox. - `autohighlight`: The first focused item is highlighted as the user types - `autocomplete`: Navigating the listbox with the arrow keys selects the item and the input is updated." />
<ui:prop name="selectionBehavior" type="Jramke\FluidPrimitives\Enum\ComboboxSelectionBehavior" optional="{true}" client="{true}" description="The behavior of the combobox input when an item is selected - `replace`: The selected item string is set as the input value - `clear`: The input value is cleared - `preserve`: The input value is preserved. Defaults to `replace` or if multiple enabled `clear`" />
<ui:prop name="composite" type="boolean" optional="{true}" client="{true}" default="{true}" description="Whether the combobox is a composed with other composite widgets like tabs." />
<ui:prop name="autoFocus" type="boolean" optional="{true}" client="{true}" description="Whether to autofocus the input on mount." />
<ui:prop name="positioning" type="array" optional="{true}" client="{true}" default="{ placement: 'bottom', sameWidth: '{true}' }" description="The positioning options to dynamically position the menu." />
<ui:prop name="filterHook" type="string" optional="{true}" client="{true}" description="The name of the hook to filter the combobox items." />
<ui:prop name="translations" type="array" optional="{true}" client="{true}" description="Localized combobox labels. Set entries to `{false}` to omit the corresponding `aria-label`. Use `f:translate` for per-template localization overrides when needed." />

<f:variable name="refData" value="{invalid: invalid, readonly: readOnly}" />

<div
    {f:if(condition: class, then: 'class="{class}"' )}
    {f:if(condition: context.ids.root, then: 'id="{context.ids.root}"' )}
    {ui:ref(name: 'root' , data: refData )}
    {ui:attributes()}>
    <f:slot />
</div>
