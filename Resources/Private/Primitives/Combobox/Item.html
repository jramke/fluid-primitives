<ui:prop name="item" type="mixed" optional="{true}" context="{true}" />
<ui:prop name="renderedOnClient" type="boolean" optional="{true}" default="{false}" context="{true}" description="Whether this item's real data/state is filled in later, client-side (e.g. inside a ui:template block, from an async search result). When true, `item` is not required and item state (selected/disabled/highlighted) is not computed server-side - the client sets the real data-value/id (e.g. via ComponentHydrator.setRefAttributes) after cloning, and correct ARIA state is picked up automatically on the next render once the item is in the DOM." />

<ui:error when="!{item} && !{renderedOnClient}" message="The {component.fullName} requires an 'item' prop, unless 'renderedOnClient' is set." />

<f:variable name="itemState" value="{value: '', selected: false, disabled: false, highlighted: false}" />
<f:if condition="!{renderedOnClient}">
    <f:variable name="itemState">{context -> ui:call(method: 'getItemState', arguments: {0: item})}</f:variable>
</f:if>
<f:variable name="refData" value="{item: item, value: itemState.value, disabled: itemState.disabled, selected: itemState.selected, highlighted: itemState.highlighted}" />

<div
    role="option"
    tabindex="-1"
    data-state="{f:if(condition: itemState.selected, then: 'checked', else: 'unchecked')}"
    {f:if(condition: itemState.selected, then: 'aria-selected="true"' )}
    {f:if(condition: itemState.disabled, then: 'aria-disabled="true"' )}
    {f:if(condition: itemState.highlighted, then: 'data-highlighted="true"' )}
    {f:if(condition: itemState.disabled, then: 'data-disabled="true"' )}
    {f:if(condition: class, then: 'class="{class}"' )}
    {f:if(condition: context.ids.item, then: 'id="{context.ids.item}"' )}
    {ui:ref(name: 'item' , value: itemState.value, data: refData )}
    {ui:attributes()}>
    <f:slot />
</div>
