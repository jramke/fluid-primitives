<ui:prop name="value" type="string" optional="{true}" />

<f:variable name="state">{f:if(condition: context.defaultOpen, then: 'open', else: 'closed')}</f:variable>
<f:variable name="expanded">{f:if(condition: context.defaultOpen, then: '{true}', else: '{false}')}</f:variable>
<f:variable name="refData" value="{state: state, expanded: expanded}" />

<button
    type="button"
    {f:if(condition: class, then: 'class="{class}"' )}
    {ui:ref(name: 'trigger' , value: value, data: refData )}
    {ui:attributes()}>
    <f:slot />
</button>
