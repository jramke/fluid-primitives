<f:variable name="state">{context.defaultOpen ? 'open' : 'closed'}</f:variable>
<f:variable name="expanded">{context.defaultOpen ? '' : null}</f:variable>
<f:variable name="refData" value="{state: state, expanded: expanded}" />

<button
    type="button"
    {f:if(condition: class, then: 'class="{class}"' )}
    id="{ui:partId(part: 'trigger')}"
    {ui:ref(name: 'trigger' , data: refData )}
    {ui:attributes()}>
    <f:slot />
</button>
