<ui:prop name="paginator" type="TYPO3\CMS\Core\Pagination\PaginatorInterface" optional="{true}" description="The TYPO3 paginator of the list, e.g. an `ArrayPaginator` or a `QueryResultPaginator`. Wrap it in a `UrlAwarePaginator` for links. It sets the current page and the number of pages." />
<ui:prop name="count" type="integer" optional="{true}" description="The total number of items. Without a `paginator`, it sets the number of pages together with `defaultPageSize`." />
<ui:prop name="defaultPage" type="integer" optional="{true}" default="1" description="The page that is current when rendered. A `paginator` sets it instead." />
<ui:prop name="defaultPageSize" type="integer" optional="{true}" client="{true}" default="10" description="The number of items per page. With a `paginator`, set it to the items per page of the paginator, so the page size in `onPageChange` matches." />
<ui:prop name="siblingCount" type="integer" optional="{true}" client="{true}" default="1" description="The number of pages shown on each side of the current page." />
<ui:prop name="boundaryCount" type="integer" optional="{true}" client="{true}" default="1" description="The number of pages always shown at the start and at the end." />
<ui:prop name="pageUrls" type="array" optional="{true}" description="The URL of every page, keyed by the page number starting at 1, for links without a `UrlAwarePaginator`. With it, the items and triggers are links to their page." />
<ui:prop name="translations" type="array" optional="{true}" client="{true}" description="Localized labels: `rootLabel`, `firstTriggerLabel`, `prevTriggerLabel`, `nextTriggerLabel`, `lastTriggerLabel` and `itemLabel`, which takes a `%page%` and a `%totalPages%` placeholder. A client script can pass Zag's `itemLabel` function instead." />

<ui:error when="{context.countNextToPaginator}" message="Pass either a paginator or a count to {component.fullName}, not both: the paginator sets the number of pages." />
<ui:error when="!{context.pageUrlsKeyedByPage}" message="The keys of the pageUrls prop of {component.fullName} are the page numbers starting at 1, as the page values are. An array from 0 links every page to the next one." />

<nav
    aria-label="{context.translations.rootLabel}"
    {f:if(condition: class, then: 'class="{class}"' )}
    {ui:ref(name: 'root' )}
    {ui:attributes()}
    {ui:asChild()}>
    <f:slot />
</nav>
