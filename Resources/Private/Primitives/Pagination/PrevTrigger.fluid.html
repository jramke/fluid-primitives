<f:variable name="triggerState">{context -> ui:call(method: 'getTriggerState', arguments: {0: 'prev'})}</f:variable>
<f:variable name="refData" value="{disabled: triggerState.disabled}" />

<f:if condition="{context.link}">
    <f:then>
        <a
            {f:if(condition: triggerState.url, then: 'href="{triggerState.url}"' )}
            aria-label="{context.translations.prevTriggerLabel}"
            {f:if(condition: class, then: 'class="{class}"' )}
            {ui:ref(name: 'prevTrigger' , data: refData )}
            {ui:attributes()}
            {ui:asChild()}>
            <f:slot />
        </a>
    </f:then>
    <f:else>
        <button
            type="button"
            {f:if(condition: triggerState.disabled, then: 'disabled' )}
            aria-label="{context.translations.prevTriggerLabel}"
            {f:if(condition: class, then: 'class="{class}"' )}
            {ui:ref(name: 'prevTrigger' , data: refData )}
            {ui:attributes()}
            {ui:asChild()}>
            <f:slot />
        </button>
    </f:else>
</f:if>
