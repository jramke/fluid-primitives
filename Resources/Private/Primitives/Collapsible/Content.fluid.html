<f:variable name="hidden">{f:if(condition: context.defaultOpen, then: '{false}', else: '{true}')}</f:variable>
<f:if condition="{context.hasCollapsedSize}">
    <f:variable name="hidden" value="{false}" />
</f:if>

<f:comment>No data-state on content that is open on load, as Zag renders it: the open animation must not run before hydration.</f:comment>
<f:variable name="refData" value="{collapsible: ''}" />
<f:if condition="!{context.defaultOpen}">
    <f:variable name="refData" value="{collapsible: '', state: 'closed'}" />
</f:if>

<div
    {f:if(condition: class, then: 'class="{class}"' )}
    {ui:ref(name: 'content' , data: refData )}
    {ui:attributes()}
    {ui:asChild()}
    {f:if(condition: hidden, then: 'hidden' )}
    style="{context.contentStyleString}">
    <f:slot />
</div>
