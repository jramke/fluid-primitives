<f:variable name="refData" value="{state: context.state, disabled: context.disabled}" />

<button
    type="button"
    {f:if(condition: class, then: 'class="{class}"' )}
    {ui:ref(name: 'trigger' , data: refData )}
    aria-expanded="{context.defaultOpen ? 'true' : 'false'}"
    {ui:attributes()}>
    <f:slot />
</button>
