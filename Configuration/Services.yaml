services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Jramke\FluidPrimitives\:
    resource: '../Classes/*'

  Jramke\FluidPrimitives\Registry\HydrationRegistry:
    shared: true
    public: true

  Jramke\FluidPrimitives\Registry\PortalRegistry:
    shared: true
    public: true

  Jramke\FluidPrimitives\TypeConverter\IsoDateConverter:
    tags:
      - name: extbase.type_converter
        priority: 15
        target: DateTime
        sources: string
      - name: extbase.type_converter
        priority: 15
        target: DateTimeImmutable
        sources: string
