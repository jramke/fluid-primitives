services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Jramke\FluidPrimitives\:
    resource: '../Classes/*'

  Jramke\FluidPrimitives\Registry\HydrationRegistry:
    shared: true
    public: true

  Jramke\FluidPrimitives\Registry\PortalRegistry:
    shared: true
    public: true

  # A project overrides this alias with #[AsAlias(GlobalContextInterface::class, public: true)] on its own GlobalContext subclass
  Jramke\FluidPrimitives\Contexts\GlobalContextInterface:
    alias: Jramke\FluidPrimitives\Contexts\GlobalContext
    public: true
